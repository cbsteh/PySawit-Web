<form action="{% url 'dj-auth:login' %}" method="post">
  {% csrf_token %}
  <div class="form-group">
    <label for="id_username">Username:</label>
    <input type="text" name="username" class="form-control" required id="id_username">
  </div>

  <div class="form-group">
    <label for="id_password">Password:</label>
    <input type="password" class="form-control" name="password" required id="id_password">
  </div>

  {% if next %}
    <input type="hidden" name="next" value="{{ next }}">
  {% endif %}

  <button type="submit" class="btn btn-default">
    {{ login_button|default:'Log in' }}
  </button>
</form>
