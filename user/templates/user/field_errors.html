{% if form.errors %}
  <div class="alert alert-danger" role="alert">
    <button class="btn btn-xs close" data-dismiss="alert" tabindex="-1">
    <span rel="tooltip" data-placement="left" title="Close error panel">
      <i class="fas fa-times" style="font-size:14px"></i>
    </span>
    </button>

    <ul>
      {% for error in form.non_field_errors %}
        <li>{{ error }}</li>
      {% endfor %}
      {% for field in form %}
        {% for error in field.errors %}
        <li>{{ error }}</li>
        {% endfor %}
      {% endfor %}
    </ul>
  </div>
{% endif %}
