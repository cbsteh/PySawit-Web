{% extends parent_template|default:"user/base_user.html" %}
{% load static %}

{% block title %}Resend Activation E-Mail - {{ block.super }}{% endblock %}

{% block content %}
  <h2>Resend your account activation email</h2>
  <form action="{% url 'dj-auth:resend_activation' %}" method="post">
    {% csrf_token %}

    <div class="form-group">
      <label for="id_email">Your email you used to setup your account:</label>
      <input type="email" class="form-control" name="email" required id="id_email">
    </div>

    <button type="submit" class="btn btn-default" id="send">Resend Email</button>
  </form>
{% endblock %}

{% block extra_js %}
{% endblock %}
