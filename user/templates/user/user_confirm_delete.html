{% extends parent_template|default:"user/base_user.html" %}

{% block title %}Disable Account - {{ block.super }}{% endblock %}

{% block content %}
  <h2>Disable Account</h2>
  <div class="alert alert-danger">
    <p><i class="fas fa-exclamation-triangle"></i> Are you sure?</p>
    <p>This cannot be undone.</p>
  </div>

  <form action="{% url 'dj-auth:disable' %}" method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Disable Account</button>
  </form>
{% endblock %}
